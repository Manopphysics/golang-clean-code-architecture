name: Python CI

on:
  push:
    branches: ["**"]
    paths:
      - "python-app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "python-app/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: python-app

jobs:
  # ---------------------------------------------------------------------------
  # Lint — ruff (fast Python linter, replaces flake8 + isort)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python-app/requirements.txt

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff
        run: ruff check . --config pyproject.toml

  # ---------------------------------------------------------------------------
  # Type check — mypy
  # ---------------------------------------------------------------------------
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python-app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt mypy==1.10.0

      - name: Run mypy
        run: mypy src/ --config-file pyproject.toml

  # ---------------------------------------------------------------------------
  # Import check — confirm the app loads without errors
  # ---------------------------------------------------------------------------
  import-check:
    name: Import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python-app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check app imports cleanly
        run: python -c "from main import app; print('Import OK')"
