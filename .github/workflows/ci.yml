name: Python CI

on:
  push:
    branches: ["**"]
    paths:
      - "python-app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "python-app/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: python-app

jobs:
  # ---------------------------------------------------------------------------
  # Lint — ruff (fast Python linter, replaces flake8 + isort)
  # Always runs as long as requirements.txt exists.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python-app/requirements.txt

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Check if there is Python source to lint
        id: check_src
        run: |
          if [ -d "src" ]; then
            echo "has_src=true" >> $GITHUB_OUTPUT
          else
            echo "has_src=false" >> $GITHUB_OUTPUT
            echo "No src/ directory yet — skipping lint."
          fi

      - name: Run ruff
        if: steps.check_src.outputs.has_src == 'true'
        run: ruff check . --config pyproject.toml

  # ---------------------------------------------------------------------------
  # Type check — mypy
  # Only runs when src/ exists (added in PR-01+).
  # ---------------------------------------------------------------------------
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python-app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt mypy==1.10.0

      - name: Check if there is Python source to type-check
        id: check_src
        run: |
          if [ -d "src" ]; then
            echo "has_src=true" >> $GITHUB_OUTPUT
          else
            echo "has_src=false" >> $GITHUB_OUTPUT
            echo "No src/ directory yet — skipping mypy."
          fi

      - name: Run mypy
        if: steps.check_src.outputs.has_src == 'true'
        run: mypy src/ --config-file pyproject.toml

  # ---------------------------------------------------------------------------
  # Import check — confirm the app loads without errors.
  # Only runs when main.py exists (added in PR-01+).
  # ---------------------------------------------------------------------------
  import-check:
    name: Import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python-app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if main.py exists
        id: check_main
        run: |
          if [ -f "main.py" ]; then
            echo "has_main=true" >> $GITHUB_OUTPUT
          else
            echo "has_main=false" >> $GITHUB_OUTPUT
            echo "No main.py yet — skipping import check."
          fi

      - name: Check app imports cleanly
        if: steps.check_main.outputs.has_main == 'true'
        run: python -c "from main import app; print('Import OK')"

  # ---------------------------------------------------------------------------
  # Tests — pytest with coverage
  # Only runs when tests/ directory exists.
  # ---------------------------------------------------------------------------
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python-app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if tests exist
        id: check_tests
        run: |
          if [ -d "tests" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "No tests/ directory yet — skipping pytest."
          fi

      - name: Run pytest
        if: steps.check_tests.outputs.has_tests == 'true'
        env:
          APP_NAME: "Test App"
          SECRET_KEY: "testsecret1234567890"
          JWT_ACCESS_EXPIRES: "3600"
          JWT_REFRESH_EXPIRES: "7200"
          POSTGRES_DB_HOST: "localhost"
          MONGODB_ATLAS_URI: "mongodb://localhost:27017"
        run: pytest --override-ini="addopts=--cov=src --cov-report=term-missing --cov-fail-under=75"
